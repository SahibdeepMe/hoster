<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeTadka | Broadcast Vault v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e50914; --bg-dark: #050505; --bg-card: #0a0a0a; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        .glass { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        @keyframes loading-progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
        .animate-loading { animation: loading-progress 2s ease-in-out infinite; }
        
        .nav-link.active { color: white; position: relative; }
        .nav-link.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 2px; background: var(--primary); }

        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.1); border-radius: 5px; height: 4px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--primary); cursor: pointer; }
        
        .modal-enter { animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .category-label { position: sticky; top: 100px; z-index: 40; background: linear-gradient(to right, var(--bg-dark), transparent); }
        
        .btn-glow { box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); }
    </style>
</head>
<body class="selection:bg-red-600">

    <div id="loader" class="fixed inset-0 bg-[#020202] flex flex-col items-center justify-center z-[9999] transition-opacity duration-1000">
        <div class="relative">
            <div class="text-7xl md:text-9xl font-black text-red-600 tracking-tighter animate-pulse flex items-baseline">
                FREE<span class="text-white">TADKA</span>
            </div>
            <div class="absolute -bottom-6 left-0 w-full h-1 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full bg-red-600 animate-loading" style="width: 30%;"></div>
            </div>
        </div>
        <p class="mt-12 text-zinc-500 font-black tracking-[1em] text-[10px] uppercase">Booting Broadcast Core v5</p>
    </div>

            <div class="flex items-center gap-12">
                <h1 class="text-3xl font-black text-red-600 tracking-tighter drop-shadow-lg cursor-pointer" onclick="changeSection('home')">FREE TADKA</h1>

                    <button onclick="changeSection('home')" id="nav-home" class="nav-link active hover:text-white transition">Home</button>
                    <button onclick="changeSection('originals')" id="nav-originals" class="nav-link hover:text-white transition">Originals</button>
                    <button onclick="changeSection('vault')" id="nav-vault" class="nav-link hover:text-white transition">Vault</button>
                    <button onclick="changeSection('live')" id="nav-live" class="nav-link hover:text-white transition flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-red-600 rounded-full animate-ping"></span> Live TV
                    </button>

            </div>
            
            <div class="flex items-center gap-6">
                <div id="owner-controls" class="hidden flex items-center gap-4">
                    <button id="save-order-btn" onclick="commitSortOrder()" class="hidden bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-xl transition-all animate-pulse border border-white/20">

                <div class="absolute inset-0 bg-gradient-to-r from-[#050505] via-[#050505]/40 to-transparent"></div>

                <div class="flex flex-wrap gap-5">

                <div class="flex-grow bg-black relative aspect-video lg:aspect-auto">
                    <video id="detail-video-preview" loop playsinline class="w-full h-full object-cover opacity-80"></video>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                    <div class="absolute top-6 left-6 z-[210]">

                    <div class="absolute bottom-6 right-6 z-[210]">
                        <button id="trailer-mute-btn" onclick="toggleTrailerAudio()" class="p-4 bg-black/50 hover:bg-white hover:text-black rounded-full transition-all text-white border border-white/10 shadow-2xl">

                    <h2 id="manifest-header" class="text-3xl font-black uppercase tracking-tighter flex items-center gap-4"><i data-lucide="plus-circle" class="w-8 h-8 text-red-600"></i>Broadcast Manifest</h2>

                </div>
                <form id="manifest-form" class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="space-y-6">
                            <input id="f-title" placeholder="Entry Title (Movie or Channel)" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-6 py-4 outline-none font-bold focus:ring-1 ring-red-600 transition">
                            <div class="grid grid-cols-2 gap-4">
                                <select id="f-type" onchange="toggleManifestFields()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-4 outline-none font-bold">
                                    <option value="movie">Vault Archive</option>
                                    <option value="original">Originals</option>
                                    <option value="live">Live Channel (M3U)</option>
                                </select>

                                    <option>U</option><option>UA 13+</option><option>UA 16+</option><option>A</option>
                                </select>
                            </div>

    <script>
        const DB_NAME = 'FreeTadka_Vault_v5_Core';
        const STORE_NAME = 'archives';
        let db, movies = [], isOwner = false, keyBuffer = "", currentSection = 'home', editingId = null;
        let hlsPlayer = null;
        let activeObjectUrl = null; 
        let activeTrailerUrl = null;

        let mediaCache = { thumbnail: '', trailer: '', movie: '' };

        async function initDB() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = () => { console.error("DB failed"); resolve(null); };
                } catch(err) {
                    console.error("IndexedDB blocked/unsupported", err);
                    resolve(null);
                }
            });
        }

        async function loadMovies() {
            if (!db) { renderGrid(); return; }
            try {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const request = tx.objectStore(STORE_NAME).getAll();
                request.onsuccess = () => { 
                    try {
                        movies = request.result.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0)); 
                    } catch(sortErr) {
                        movies = request.result || [];
                    }
                    renderGrid(); 
                };
                request.onerror = () => { renderGrid(); };
            } catch(txErr) {
                console.error("Failed transaction tracking", txErr);
                renderGrid();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('movie-grid');
            const count = document.getElementById('vault-count');
            if(!grid) return;
            grid.innerHTML = '';
            
            let filtered = (currentSection === 'home') ? movies : 
                           (currentSection === 'originals') ? movies.filter(m => m.type === 'original') :
                           (currentSection === 'vault') ? movies.filter(m => m.type === 'movie') : [];

            if (currentSection === 'live') { renderLiveGrid(); return; }
            if (count) count.innerText = `${filtered.length} Objects Scanned`;

            if (filtered.length > 0) {
                updateHero(filtered[0]);
                filtered.forEach(m => grid.appendChild(createCard(m)));
            } else {
                grid.innerHTML = `<div class="col-span-full py-20 text-center opacity-20"><i data-lucide="database" class="mx-auto w-16 h-16 mb-4"></i><p class="font-black uppercase tracking-widest">No matching archives found</p></div>`;
            }
            if(window.lucide) lucide.createIcons();
        }

        function renderLiveGrid() {
            const grid = document.getElementById('movie-grid');
            const liveMovies = movies.filter(m => m.type === 'live');
            const countEl = document.getElementById('vault-count');
            if(countEl) countEl.innerText = `${liveMovies.length} Channels Online`;
            if(!grid) return;
            grid.innerHTML = (liveMovies.length === 0) ? `<div class="col-span-full py-20 text-center opacity-20"><p class="font-black uppercase tracking-widest">No Live Channels</p></div>` : '';
            
            const categories = [...new Set(liveMovies.map(m => m.category || 'General'))];
            categories.forEach(cat => {
                const header = document.createElement('div');
                header.className = "col-span-full mt-10 mb-6";
                header.innerHTML = `<h4 class="text-sm font-black text-red-600 uppercase tracking-[0.5em] flex items-center gap-4"><span class="w-8 h-[2px] bg-red-600"></span>${cat}</h4>`;
                grid.appendChild(header);
                liveMovies.filter(m => (m.category || 'General') === cat).forEach(m => grid.appendChild(createCard(m)));
            });
            if(window.lucide) lucide.createIcons();
        }

        function createCard(m) {
            const isLiveContent = m.type === 'live';
            const card = document.createElement('div');
            card.className = `relative group ${isLiveContent ? 'aspect-video rounded-xl' : 'aspect-[2/3] rounded-lg'} bg-zinc-900 overflow-hidden cursor-pointer transition-all duration-500 hover:scale-105 shadow-2xl border border-white/5 hover:border-red-600/50`;
            card.onclick = () => openDetailById(m.id);
            const ownerOverlay = isOwner ? `<div class="absolute top-2 left-2 z-30 flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-all duration-300">
                <button onclick="event.stopPropagation(); moveArchive(${m.id}, -1)" class="p-2 bg-black/60 hover:bg-white hover:text-black text-white rounded-full transition shadow-lg"><i data-lucide="chevron-up" class="w-3 h-3"></i></button>
                <button onclick="event.stopPropagation(); openManifestById(${m.id})" class="p-2 bg-black/60 hover:bg-blue-600 text-white rounded-full transition shadow-lg"><i data-lucide="edit-3" class="w-3 h-3"></i></button>
                <button onclick="event.stopPropagation(); moveArchive(${m.id}, 1)" class="p-2 bg-black/60 hover:bg-white hover:text-black text-white rounded-full transition shadow-lg"><i data-lucide="chevron-down" class="w-3 h-3"></i></button>
            </div>` : '';
            card.innerHTML = `${ownerOverlay}<img src="${m.thumbnail || 'https://placehold.co/400x600/0a0a0a/444444?text=Vault'}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-all flex flex-col justify-end p-4">
                    <div class="flex gap-2 mb-3"><button class="p-2 bg-white rounded-full text-black hover:scale-110 transition"><i data-lucide="play" class="w-3 h-3 fill-current"></i></button>
                    ${isOwner ? `<button onclick="event.stopPropagation(); deleteMovie(${m.id})" class="p-2 bg-zinc-800/80 hover:bg-red-600 rounded-full text-white ml-auto transition"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}</div>
                    <h4 class="font-black text-[10px] uppercase tracking-tighter mb-1 line-clamp-1">${m.title}</h4>
                    <div class="flex justify-between text-[8px] font-bold text-zinc-400"><span>${m.rating}</span><span class="${isLiveContent ? 'text-blue-500' : 'text-red-500'} uppercase">${isLiveContent ? m.category : m.type}</span></div>
                </div>${isLiveContent ? '<div class="absolute top-3 right-3 px-2 py-1 bg-red-600 text-[8px] font-black uppercase rounded shadow-lg animate-pulse z-10">Live</div>' : ''}`;
            return card;
        }

        async function moveArchive(id, direction) {
            const index = movies.findIndex(m => m.id === id);
            if (index === -1) return;
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= movies.length) return;
            [movies[index], movies[targetIndex]] = [movies[targetIndex], movies[index]];
            document.getElementById('save-order-btn').classList.remove('hidden');
            renderGrid();
        }

        async function commitSortOrder() {
            if(!db) return;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            movies.forEach((m, i) => { m.sortOrder = i; store.put(m); });
            tx.oncomplete = () => { document.getElementById('save-order-btn').classList.add('hidden'); triggerToast("ARRANGEMENT SAVED"); };
        }

        function updateHero(m) {
            const container = document.getElementById('hero-details');
            if (!m || !container) return;
            container.classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('hero-img').src = m.thumbnail || 'https://placehold.co/1920x1080/050505/333333?text=FreeTadka';
                document.getElementById('hero-title').innerText = m.title || '';
                document.getElementById('hero-desc').innerText = m.description || "Premium cinematic archive entry.";
                document.getElementById('hero-category-tag').innerText = m.type || '';
                document.getElementById('hero-play-btn').onclick = () => startPlayerById(m.id);
                container.classList.remove('opacity-0', 'translate-y-10');
            }, 300);
        }

        function helperConvertBase64ToBlobUrl(base64Str) {
            if (base64Str && typeof base64Str === 'string' && base64Str.startsWith('data:')) {
                try {
                    const parts = base64Str.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const bstr = atob(parts[1]);
                    let n = bstr.length, u8arr = new Uint8Array(n);
                    while(n--) u8arr[n] = bstr.charCodeAt(n);
                    const blob = new Blob([u8arr], {type: mime});
                    return URL.createObjectURL(blob);
                } catch (e) {
                    console.error("Blob conversion error:", e);
                    return base64Str;
                }
            }
            return base64Str;
        }

        function startPlayerById(id) {
            const m = movies.find(item => item.id === id);
            if (!m) return;
            
            closeDetail();

            const overlay = document.getElementById('player-overlay');
            const video = document.getElementById('main-video');
            document.getElementById('player-title').innerText = m.title;
            overlay.classList.remove('hidden');

            if (activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = null; }
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

            let source = m.movie;
            const isM3U8 = (source && typeof source === 'string' && source.includes('.m3u8')) || m.type === 'live';

            if (!isM3U8 && source && source.startsWith('data:')) {
                activeObjectUrl = helperConvertBase64ToBlobUrl(source);
                source = activeObjectUrl;
            }

            if (isM3U8) {
                if (window.Hls && Hls.isSupported()) {
                    hlsPlayer = new Hls(); hlsPlayer.loadSource(source); hlsPlayer.attachMedia(video);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => { setupQualityMenu(hlsPlayer.levels); video.play(); });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = source; video.play(); }
            } else {
                video.src = source || '';
                video.play();
                document.getElementById('quality-menu').innerHTML = `<p class='p-4 text-[10px] text-zinc-500 uppercase font-black'>Standard Stream</p>`;
            }
            
            video.ontimeupdate = () => {
                const prog = (video.currentTime / video.duration) * 100;
                document.getElementById('player-progress-bar').style.width = isNaN(prog) ? '0%' : prog + '%';
            };
        }

        function setupQualityMenu(levels) {
            const menu = document.getElementById('quality-menu');
            if(!menu) return;
            menu.innerHTML = `<button onclick="hlsPlayer.currentLevel = -1; document.getElementById('current-quality').innerText = 'Auto'" class="w-full p-4 text-left hover:bg-white/10 text-[10px] uppercase font-bold border-b border-white/5">Auto Resolution</button>`;
            levels.forEach((l, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 text-left hover:bg-white/10 text-[10px] uppercase font-bold border-b border-white/5";
                btn.innerText = `${l.height}p Broadcast`;
                btn.onclick = () => { hlsPlayer.currentLevel = i; document.getElementById('current-quality').innerText = l.height + 'p'; };
                menu.appendChild(btn);
            });
        }

        function openManifestById(id) {
            const item = movies.find(m => m.id === id);
            openManifest(item);
        }

        function openManifest(item = null) {
            editingId = item ? item.id : null;
            mediaCache = { thumbnail: item ? item.thumbnail : '', trailer: item ? item.trailer : '', movie: item ? item.movie : '' };
            document.getElementById('f-title').value = item ? item.title : '';
            document.getElementById('f-type').value = item ? item.type : 'movie';
            document.getElementById('f-rating').value = item ? item.rating : 'U';
            document.getElementById('f-category').value = item ? item.category : '';
            document.getElementById('f-desc').value = item ? item.description : '';
            document.getElementById('manifest-header').innerHTML = item ? `<i data-lucide="edit-3" class="w-8 h-8 text-blue-500"></i>Update Archive` : `<i data-lucide="plus-circle" class="w-8 h-8 text-red-600"></i>Broadcast Manifest`;
            document.getElementById('manifest-submit-btn').innerText = item ? 'Save Changes' : 'Commit to Storage';
            toggleManifestFields();
            ['thumbnail', 'trailer', 'movie'].forEach(key => buildAssetInput(key, mediaCache[key]));
            document.getElementById('manifest-modal').classList.remove('hidden');
            if(window.lucide) lucide.createIcons();
        }

        function toggleManifestFields() {
            const type = document.getElementById('f-type').value;
            document.getElementById('live-fields').className = (type === 'live') ? '' : 'hidden';
        }

        function buildAssetInput(key, existingValue = '') {
            const container = document.getElementById(`asset-${key}`);
            if(!container) return;
            const labels = { thumbnail: 'Logo/Poster', trailer: 'Archive Trailer', movie: 'Full Archive/M3U8' };
            const isUrl = existingValue && !existingValue.startsWith('data:');
            container.innerHTML = `<div class="flex justify-between items-center mb-3"><span class="text-[10px] font-black uppercase text-zinc-500">${labels[key]}</span>
                <div class="flex bg-black p-1 rounded-full text-[8px] font-black border border-white/5">
                    <button type="button" onclick="setAssetType('${key}', 'url')" id="${key}-url-btn" class="px-3 py-1 rounded-full ${isUrl || !existingValue ? 'bg-red-600' : ''} transition">URL</button>
                    <button type="button" onclick="setAssetType('${key}', 'file')" id="${key}-file-btn" class="px-3 py-1 rounded-full ${!isUrl && existingValue ? 'bg-red-600' : ''} transition">FILE</button>
                </div></div><div id="${key}-input-box"><input oninput="mediaCache['${key}'] = this.value" value="${isUrl ? existingValue : ''}" placeholder="Paste link here..." class="w-full bg-black border border-zinc-800 rounded-lg px-4 py-3 outline-none text-xs text-red-500 font-mono"></div>`;
            if (!isUrl && existingValue) { setAssetType(key, 'file'); document.getElementById(`${key}-status`)?.classList.remove('hidden'); }
        }

        function setAssetType(key, type) {
            const box = document.getElementById(`${key}-input-box`);
            if(!box) return;
            document.getElementById(`${key}-url-btn`).className = `px-3 py-1 rounded-full ${type === 'url' ? 'bg-red-600' : ''}`;
            document.getElementById(`${key}-file-btn`).className = `px-3 py-1 rounded-full ${type === 'file' ? 'bg-red-600' : ''}`;
            if (type === 'file') {
                box.innerHTML = `<div class="relative"><input type="file" onchange="processFile('${key}', this)" class="w-full text-[10px] bg-black p-3 rounded-lg border border-zinc-800 cursor-pointer"><div id="${key}-status" class="${mediaCache[key] && mediaCache[key].startsWith('data:') ? '' : 'hidden'} absolute right-3 top-3 text-green-500"><i data-lucide="check-circle" class="w-4 h-4"></i></div></div>`;
                if(window.lucide) lucide.createIcons();
            } else {
                box.innerHTML = `<input oninput="mediaCache['${key}'] = this.value" value="${mediaCache[key] && !mediaCache[key].startsWith('data:') ? mediaCache[key] : ''}" placeholder="Paste link here..." class="w-full bg-black border border-zinc-800 rounded-lg px-4 py-3 outline-none text-xs text-red-500 font-mono">`;
            }
        }

        function processFile(key, input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { mediaCache[key] = e.target.result; document.getElementById(`${key}-status`)?.classList.remove('hidden'); triggerToast(`${key.toUpperCase()} SYNCED`); };
            reader.readAsDataURL(file);
        }

        document.getElementById('manifest-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!db) return;
            const archive = { title: document.getElementById('f-title').value, type: document.getElementById('f-type').value, rating: document.getElementById('f-rating').value, category: document.getElementById('f-category').value || 'Uncategorized', description: document.getElementById('f-desc').value, thumbnail: mediaCache.thumbnail, trailer: mediaCache.trailer, movie: mediaCache.movie };
            if (editingId) archive.id = editingId; else archive.sortOrder = movies.length;
            const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME);
            editingId ? store.put(archive) : store.add(archive);
            tx.oncomplete = () => { closeManifest(); loadMovies(); triggerToast(editingId ? "UPDATED" : "COMMITTED"); editingId = null; };
        };

        function exportVault() {
            const blob = new Blob([JSON.stringify(movies)], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `FreeTadka_Sync_${Date.now()}.txt`; a.click();
            triggerToast("EXPORT READY");
        }

        function importVault(input) {
            if(!db || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result); const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME);
                    data.forEach(m => { delete m.id; store.add(m); });
                    tx.oncomplete = () => { loadMovies(); triggerToast("SYNC COMPLETE"); };
                } catch(err) { triggerToast("INVALID FILE"); }
            };
            reader.readAsText(input.files[0]);
        }

        function changeSection(sec) {
            currentSection = sec;
            document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.id === `nav-${sec}`));
            renderGrid();
        }

        function openDetailById(id) {
            const m = movies.find(item => item.id === id);
            if (!m) return;

            const panel = document.getElementById('detail-info-panel');
            const video = document.getElementById('detail-video-preview');
            const muteBtn = document.getElementById('trailer-mute-btn');
            
            if (activeTrailerUrl) { URL.revokeObjectURL(activeTrailerUrl); activeTrailerUrl = null; }

            let rawTrailer = m.trailer || m.movie;
            if (rawTrailer && rawTrailer.startsWith('data:')) {
                activeTrailerUrl = helperConvertBase64ToBlobUrl(rawTrailer);
                video.src = activeTrailerUrl;
            } else {
                video.src = rawTrailer || '';
            }

            video.muted = false; 
            video.play().catch(e => console.log("Auto-play tracking prevented", e));
            if(muteBtn) muteBtn.innerHTML = `<i data-lucide="volume-2" class="w-6 h-6"></i>`;
            
            if(panel) {
                panel.innerHTML = `<h2 class="text-4xl font-black mb-4 uppercase tracking-tighter">${m.title}</h2>
                    <div class="flex gap-3 mb-8"><span class="px-2 py-1 bg-red-600 rounded text-[10px] font-black">${m.rating}</span>
                    <span class="px-2 py-1 bg-zinc-800 rounded text-[10px] font-black uppercase text-zinc-400">${m.type}</span>
                    ${m.type === 'live' ? `<span class="px-2 py-1 bg-blue-900 rounded text-[10px] font-black text-white">${m.category}</span>` : ''}</div>
                    <button onclick='startPlayerById(${m.id})' class="w-full bg-white text-black py-5 rounded-xl font-black uppercase text-lg mb-8 hover:scale-105 transition shadow-2xl">Play Full Movie</button>
                    <div class="space-y-4"><h4 class="text-[10px] font-black text-red-600 uppercase tracking-widest">Metadata</h4>
                    <p class="text-zinc-400 text-sm leading-relaxed border-l-2 border-zinc-800 pl-4 italic">"${m.description || 'No description provided.'}"</p></div>`;
            }
            document.getElementById('detail-modal').classList.remove('hidden');
            if(window.lucide) lucide.createIcons();
        }

        function toggleTrailerAudio() {
            const video = document.getElementById('detail-video-preview');
            if(!video) return;
            video.muted = !video.muted;
            document.getElementById('trailer-mute-btn').innerHTML = `<i data-lucide="volume-${video.muted ? 'x' : '2'}" class="w-6 h-6"></i>`;
            if(window.lucide) lucide.createIcons();
        }

        function closeDetail() { 
            const video = document.getElementById('detail-video-preview');
            if(video) {
                video.pause(); 
                video.src = ""; 
                video.load();
            }
            if (activeTrailerUrl) { URL.revokeObjectURL(activeTrailerUrl); activeTrailerUrl = null; }
            document.getElementById('detail-modal').classList.add('hidden'); 
        }

        function closeManifest() { document.getElementById('manifest-modal').classList.add('hidden'); editingId = null; }
        
        function closePlayer() { 
            const v = document.getElementById('main-video');
            if(v) {
                v.pause();
                v.src = ""; 
                v.load();
            }
            if(activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = null; }
            document.getElementById('player-overlay').classList.add('hidden'); 
        }

        function togglePlay() { 
            const v = document.getElementById('main-video'); const icon = document.getElementById('play-icon');
            if(!v) return;
            if(v.paused) { v.play(); if(icon) icon.setAttribute('data-lucide', 'pause'); } 
            else { v.pause(); if(icon) icon.setAttribute('data-lucide', 'play'); }
            if(window.lucide) lucide.createIcons(); 
        }

        function triggerToast(m) {
            const t = document.createElement('div'); t.className = "fixed bottom-10 left-1/2 -translate-x-1/2 bg-red-600 text-white px-10 py-4 rounded-full font-black z-[5000] animate-bounce shadow-2xl border border-white/20";
            t.innerText = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        function deleteMovie(id) {
            if(!db) return;
            const tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).delete(id); tx.oncomplete = loadMovies;
        }

        window.onkeydown = (e) => {
            keyBuffer = (keyBuffer + e.key).slice(-6);
            if (keyBuffer.toLowerCase() === "123abc") { isOwner = true; document.getElementById('owner-controls').classList.remove('hidden'); triggerToast("ADMIN GRANTED"); renderGrid(); }
        };

        window.onload = async () => {
            try {
                await initDB(); 
                await loadMovies();
            } catch(loadErr) {
                console.error("Critical error inside setup chain", loadErr);
            } finally {
                // FORCE remove the loader screen no matter what happens to avoid black screen hanging
                setTimeout(() => { 
                    const ldr = document.getElementById('loader');
                    const app = document.getElementById('app');
                    if(ldr) ldr.classList.add('opacity-0'); 
                    setTimeout(() => { 
                        if(ldr) ldr.classList.add('hidden'); 
                        if(app) app.classList.remove('hidden'); 
                    }, 1000); 
                }, 1500);
            }
            if(window.lucide) lucide.createIcons();
        };

        function videoJump(s) { const v = document.getElementById('main-video'); if(v) v.currentTime += s; }
        function changeVolume(v) { const video = document.getElementById('main-video'); if(video) video.volume = v; }
        function toggleFullscreen() { const video = document.getElementById('main-video'); if(!video) return; if (video.requestFullscreen) video.requestFullscreen(); else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen(); }
        function seekVideo(e) { const bar = document.getElementById('player-progress-container'); const video = document.getElementById('main-video'); if(!bar || !video) return; const pos = (e.pageX - bar.offsetLeft) / bar.offsetWidth; video.currentTime = pos * video.duration; }
    </script>
</body>
</html>
