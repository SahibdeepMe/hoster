<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Dream Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@300;400;600&display=swap');

        :root {
            --accent: #ff007a;
            --glass: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
            --arm-rest-deg: -60deg;
            --arm-play-deg: -18deg;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        .custom-scroll {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 20px; }

        .player-shell {
            background: var(--glass);
            backdrop-filter: blur(60px) saturate(200%);
            border: 1.5px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .main-content { flex-direction: row; }
            .player-shell { border-radius: 50px; }
        }

        /* --- Vinyl Deck --- */
        .deck-container {
            position: relative;
            width: 200px; height: 200px;
            margin: 0 auto; flex-shrink: 0;
        }
        @media (min-width: 768px) { .deck-container { width: 240px; height: 240px; } }

        #vinyl {
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at center, #ff007a 0%, #ff007a 12%, transparent 13%),
                repeating-radial-gradient(circle at center, #000 0, #000 1px, #1a1a1a 2px, #000 3px);
            border-radius: 50%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .is-spinning #vinyl { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .tonearm-stick {
            position: absolute;
            top: 15%; right: 5%;
            width: 45%; height: 6px;
            background: linear-gradient(to bottom, #fff, #ddd);
            border-radius: 10px;
            transform-origin: calc(100% - 10px) 50%;
            z-index: 50;
            transform: rotate(var(--arm-rest-deg));
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .arm-playing { transform: rotate(var(--arm-play-deg)) !important; }

        .play-btn {
            width: 60px; height: 60px;
            background: #111; color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* --- Progress Slider --- */
        .central-slider-container {
            width: 100%;
            padding: 0 30px;
            margin-top: 15px;
        }

        .main-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.1);
            border-radius: 5px;
            outline: none;
        }

        .main-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent);
        }

        /* --- Downside Light --- */
        .downside-light {
            width: 100%; height: 4px;
            background: rgba(0,0,0,0.05);
            position: absolute;
            bottom: 0; left: 0;
        }
        .light-fill {
            height: 100%; width: 0%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.1s linear;
        }

        .song-item {
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.2s;
        }
        .song-item.active { background: white; border: 1px solid var(--accent); }

        /* Menu Styles */
        #library-menu {
            display: none;
            position: absolute;
            top: 65px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            padding: 8px;
            z-index: 1000;
        }

        .search-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            width: 100%;
        }
        .search-container.open { max-height: 60px; }
    </style>
</head>
<body>

    <input type="file" id="file-input" multiple accept=".mp3" class="hidden">

    <div class="player-shell" id="player-main">
        <div class="w-full p-4 border-b border-black/5 flex justify-center gap-8 md:gap-14 relative z-50">
            <div class="relative group">
                <button onclick="toggleMenu()" class="flex flex-col items-center gap-1">
                    <i class="fas fa-compact-disc text-slate-400 group-hover:text-pink-500 text-xl"></i>
                    <span class="text-[9px] font-bold uppercase text-slate-400">Library</span>
                </button>
                <div id="library-menu" class="border border-black/5">
                    <button onclick="pickFiles()" class="block w-full text-left px-4 py-2 text-[10px] font-bold hover:bg-pink-50 rounded-lg mb-1">SELECT MP3 FILES</button>
                    <button onclick="pickFolder()" class="block w-full text-left px-4 py-2 text-[10px] font-bold hover:bg-pink-50 rounded-lg">SELECT FULL FOLDER</button>
                </div>
            </div>

            <button onclick="toggleSearch()" class="flex flex-col items-center gap-1 group">
                <i class="fas fa-search text-slate-400 group-hover:text-pink-500 text-xl"></i>
                <span class="text-[9px] font-bold uppercase text-slate-400">Search</span>
            </button>

            <button onclick="fetchGitHubSongs()" class="flex flex-col items-center gap-1 group">
                <i class="fab fa-github text-slate-400 group-hover:text-pink-500 text-xl"></i>
                <span class="text-[9px] font-bold uppercase text-slate-400">Cloud</span>
            </button>
        </div>

        <div class="main-content flex flex-col md:flex-row flex-1 overflow-hidden">
            <div class="flex-1 p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-black/5">
                <div class="deck-container" id="deck">
                    <div class="tonearm-stick" id="stick"></div>
                    <div id="vinyl"></div>
                </div>

                <div class="text-center w-full mt-6">
                    <h1 id="current-name" class="text-lg font-bold text-slate-900 mb-6 truncate px-4">Dreamy Player</h1>
                    
                    <div class="flex items-center justify-center gap-8 mb-4">
                        <button onclick="prevSong()" class="text-slate-400 hover:text-pink-500"><i class="fas fa-step-backward text-xl"></i></button>
                        <button onclick="togglePlay()" class="play-btn" id="main-play-btn"><i id="play-icon" class="fas fa-play text-xl"></i></button>
                        <button onclick="nextSong()" class="text-slate-400 hover:text-pink-500"><i class="fas fa-step-forward text-xl"></i></button>
                    </div>

                    <div class="central-slider-container">
                        <input type="range" id="seek-slider" class="main-slider" min="0" max="100" value="0">
                        <div class="flex justify-between mt-1 text-[9px] font-bold text-slate-400">
                            <span id="current-time">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-5/12 p-6 flex flex-col overflow-hidden">
                <div id="search-bar" class="search-container mb-2">
                    <div class="flex items-center bg-black/5 rounded-xl px-3 py-2 border border-black/5">
                        <i class="fas fa-search text-slate-300 text-xs mr-2"></i>
                        <input type="text" id="search-input" placeholder="Search in library..." class="bg-transparent outline-none text-xs w-full" oninput="filterPlaylist()">
                    </div>
                </div>

                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4" id="source-label">Playlist</p>
                <div id="song-list" class="space-y-2 custom-scroll flex-1 pr-2 pb-6">
                    <p class="text-center py-20 opacity-30 text-[10px] font-bold">LIBRARY IS EMPTY</p>
                </div>
            </div>
        </div>

        <div class="downside-light"><div class="light-fill" id="light-fill"></div></div>
    </div>

    <audio id="audio-engine"></audio>

    <script type="module">
        import { get, set } from 'https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm';

        const audio = document.getElementById('audio-engine');
        const stick = document.getElementById('stick');
        const deck = document.getElementById('deck');
        const songList = document.getElementById('song-list');
        const nameDisplay = document.getElementById('current-name');
        const seekSlider = document.getElementById('seek-slider');
        const lightFill = document.getElementById('light-fill');
        const libraryMenu = document.getElementById('library-menu');
        const fileInput = document.getElementById('file-input');
        const searchBar = document.getElementById('search-bar');
        const searchInput = document.getElementById('search-input');
        
        let playlist = [];
        let filteredPlaylist = [];
        let currentIndex = -1;
        let isPlaying = false;

        window.toggleMenu = () => libraryMenu.style.display = libraryMenu.style.display === 'block' ? 'none' : 'block';
        window.toggleSearch = () => {
            searchBar.classList.toggle('open');
            if(searchBar.classList.contains('open')) searchInput.focus();
        };

        window.pickFiles = () => { libraryMenu.style.display = 'none'; fileInput.click(); };
        fileInput.onchange = (e) => {
            playlist = Array.from(e.target.files).map(file => ({
                title: file.name.replace(/\.[^/.]+$/, ""),
                url: URL.createObjectURL(file),
                isLocal: true
            }));
            document.getElementById('source-label').innerText = "Selected Files";
            filterPlaylist();
        };

        window.pickFolder = async () => {
            libraryMenu.style.display = 'none';
            try {
                const handle = await window.showDirectoryPicker();
                await set('last-folder', handle);
                scanFolder(handle);
            } catch (e) {}
        };

        async function scanFolder(handle) {
            if (await handle.queryPermission() !== 'granted') await handle.requestPermission();
            playlist = [];
            for await (const entry of handle.values()) {
                if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.mp3')) {
                    playlist.push({ title: entry.name.replace(/\.[^/.]+$/, ""), handle: entry, isHandle: true });
                }
            }
            document.getElementById('source-label').innerText = handle.name;
            filterPlaylist();
        }

        window.fetchGitHubSongs = async () => {
            const res = await fetch(`https://api.github.com/repos/SahibdeepMe/Music-Player/contents/Songs`);
            const data = await res.json();
            playlist = data.filter(f => f.name.toLowerCase().endsWith('.mp3')).map(f => ({
                title: f.name.replace(/\.[^/.]+$/, ""), url: f.download_url, isHandle: false
            }));
            document.getElementById('source-label').innerText = "Cloud Storage";
            filterPlaylist();
        };

        window.filterPlaylist = () => {
            const term = searchInput.value.toLowerCase();
            filteredPlaylist = playlist.filter(s => s.title.toLowerCase().includes(term));
            render();
        };

        function render() {
            if (filteredPlaylist.length === 0) {
                songList.innerHTML = '<p class="text-center py-20 opacity-30 text-[10px] font-bold">NO SONGS FOUND</p>';
                return;
            }
            songList.innerHTML = filteredPlaylist.map((s, i) => `
                <div class="song-item ${currentIndex === i ? 'active' : ''}" onclick="selectSong(${i})">
                    <span class="text-xs font-bold text-slate-700 truncate">${s.title}</span>
                </div>
            `).join('');
        }

        window.selectSong = async (i) => {
            currentIndex = i;
            const song = filteredPlaylist[i];
            audio.src = song.isHandle ? URL.createObjectURL(await song.handle.getFile()) : song.url;
            nameDisplay.innerText = song.title;
            render(); play();
        };

        function play() {
            isPlaying = true; audio.play();
            deck.classList.add('is-spinning');
            stick.classList.add('arm-playing');
            document.getElementById('play-icon').className = 'fas fa-pause text-xl';
        }

        window.togglePlay = () => {
            if (playlist.length === 0) { toggleMenu(); return; }
            if (currentIndex === -1) { selectSong(0); return; }
            if (isPlaying) {
                audio.pause(); isPlaying = false;
                deck.classList.remove('is-spinning');
                stick.classList.remove('arm-playing');
                document.getElementById('play-icon').className = 'fas fa-play text-xl';
            } else play();
        };

        window.nextSong = () => { if(filteredPlaylist.length) selectSong((currentIndex + 1) % filteredPlaylist.length); };
        window.prevSong = () => { if(filteredPlaylist.length) selectSong((currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length); };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = pct;
                lightFill.style.width = pct + "%";
                document.getElementById('current-time').innerText = formatTime(audio.currentTime);
                document.getElementById('duration').innerText = formatTime(audio.duration);
            }
        };

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        seekSlider.oninput = () => audio.currentTime = (seekSlider.value / 100) * audio.duration;
        audio.onended = () => window.nextSong();
        get('last-folder').then(h => { if(h) scanFolder(h); });
        window.onclick = (e) => { if (!e.target.closest('.group')) libraryMenu.style.display = 'none'; };
    </script>
</body>
</html>
